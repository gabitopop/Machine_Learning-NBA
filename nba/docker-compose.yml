version: '3.8'

services:
  nba-ml:
    build: .
    container_name: nba-ml-pipeline
    volumes:
      - ./data:/app/data
      - ./metrics:/app/metrics
      - ./plots:/app/plots
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app/src
      - KEDRO_CONFIG_FILE=conf/local/parameters.yml
    command: ["./entrypoint.sh"]
    
  nba-jupyter:
    build: .
    container_name: nba-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks
      - ./src:/app/src
      - ./conf:/app/conf
    environment:
      - PYTHONPATH=/app/src
    command: ["kedro", "jupyter", "notebook", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root"]
    
  nba-airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: nba-airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - PYTHONPATH=/opt/airflow/src:/opt/airflow
      - KEDRO_CONFIG_FILE=conf/local/parameters.yml
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
      - ./conf:/opt/airflow/conf
      - ./pyproject.toml:/opt/airflow/pyproject.toml
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ./metrics:/opt/airflow/data/metrics
      - .:/opt/airflow/project:ro
    ports:
      - "8080:8080"
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true &&
        airflow webserver --port 8080 &
        airflow scheduler
      "

