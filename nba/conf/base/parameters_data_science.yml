# Parámetros para el pipeline de ciencia de datos NBA

# Configuración de división de datos
data_splitting:
  test_size: 0.2  # 20% para prueba
  val_size: 0.2   # 20% del entrenamiento para validación
  random_state: 42
  stratify: true  # estratificación para mantener proporción de clases

# Configuración de características (features)
features:
  # Variables predictoras principales
  numeric_features:
    - pts_home
    - pts_away
    - fg_pct_home
    - fg_pct_away
    - fg3_pct_home
    - fg3_pct_away
    - ft_pct_home
    - ft_pct_away
    - reb_home
    - reb_away
    - oreb_home
    - oreb_away
    - dreb_home
    - dreb_away
    - ast_home
    - ast_away
    - stl_home
    - stl_away
    - blk_home
    - blk_away
    - tov_home
    - tov_away
    - pf_home
    - pf_away
    - plus_minus_home
    - plus_minus_away
  
  # Variables diferenciales
  differential_features:
    - pts_diff
    - fg_pct_diff
    - reb_diff
    - ast_diff
    - stl_diff
    - blk_diff
    - tov_diff
    - efficiency_diff
  
  # Variables de fecha
  date_features:
    - year
    - month
    - day_of_week
    - is_weekend
    - is_playoff_season
  
  # Variables categóricas codificadas
  categorical_features:
    - team_home_encoded
    - team_away_encoded
    - season_Regular Season
    - season_Playoffs
    - season_Pre Season
    - season_All Star
    - season_All-Star

# Variable objetivo
target: home_win

# Configuración de modelos
models:
  # Random Forest
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
    n_jobs: -1
  
  # Gradient Boosting
  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 6
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
  
  # Regresión Logística
  logistic_regression:
    C: 1.0
    max_iter: 1000
    random_state: 42
    solver: liblinear
  
  # Support Vector Machine
  svm:
    C: 1.0
    kernel: rbf
    gamma: scale
    random_state: 42

# Configuración de validación cruzada
cross_validation:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: roc_auc

# Configuración de búsqueda de hiperparámetros
hyperparameter_tuning:
  # Random Forest
  random_forest_params:
    n_estimators: [50, 100, 200]
    max_depth: [5, 10, 15, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
  
  # Gradient Boosting
  gradient_boosting_params:
    n_estimators: [50, 100, 200]
    learning_rate: [0.01, 0.1, 0.2]
    max_depth: [3, 6, 9]
    min_samples_split: [2, 5, 10]
  
  # Regresión Logística
  logistic_regression_params:
    C: [0.1, 1.0, 10.0]
    max_iter: [1000, 2000]
    solver: [liblinear, lbfgs]

# Configuración de evaluación
model_evaluation:
  # Métricas principales
  primary_metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
  
  # Métricas adicionales
  secondary_metrics:
    - confusion_matrix
    - classification_report
    - roc_curve
    - precision_recall_curve
  
  # Configuración de threshold para clasificación
  classification_threshold: 0.5

# Configuración de balanceo de clases
class_balancing:
  # Detectar desequilibrio
  imbalance_threshold: 0.1  # 10% de diferencia se considera desequilibrio
  
  # Técnicas de balanceo
  techniques:
    - smote  # Synthetic Minority Oversampling Technique
    - random_oversampling
    - random_undersampling
    - class_weight  # para modelos que lo soporten
  
  # Configuración SMOTE
  smote_params:
    k_neighbors: 5
    random_state: 42